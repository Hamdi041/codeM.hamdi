<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KosVibe - Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg sticky-top navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand text-white" href="index.html">📊 KosVibe Control System</a>
            <a href="index.html" class="btn btn-sm btn-outline-light"><i class="bi bi-arrow-left"></i> Kembali ke Beranda</a>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row g-4">
            <div class="col-md-7">
                <div class="card p-4 border-0 shadow-sm bg-white">
                    <h5 class="fw-bold mb-3 text-dark"><i class="bi bi-collection-play-fill"></i> Antrean Validasi Ulasan</h5>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle custom-table">
                            <thead><tr><th>Nama Kos</th><th>Asal</th><th>Tanggal</th><th>Status</th></tr></thead>
                            <tbody id="adminTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="col-md-5">
                <div class="card p-4 shadow-sm border-0 bg-white sticky-top" style="top: 90px;">
                    <h5 class="fw-bold border-bottom pb-2 mb-3"><i class="bi bi-shield-check-fill text-success"></i> Panel Inspektur</h5>
                    <div class="text-center bg-light p-3 rounded-3 mb-3">
                        <i class="bi bi-person-circle fs-2 text-secondary"></i>
                        <h6 class="fw-bold m-0 mt-2" id="detailName">Pilih data antrean</h6>
                        <div id="detailStars" class="text-warning fs-5 mt-1"></div>
                    </div>
                    <div class="mb-3">
                        <div class="p-3 bg-light rounded text-muted small" style="min-height: 100px;" id="detailContent">Klik baris tabel untuk melihat detail.</div>
                    </div>
                    <div class="mb-4" id="detailTagsContainer"></div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-success flex-fill fw-bold py-2" id="btnSetuju"><i class="bi bi-check-circle-fill"></i> Setujui</button>
                        <button class="btn btn-danger flex-fill fw-bold py-2" id="btnTolakReview"><i class="bi bi-x-circle-fill"></i> Tolak</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
