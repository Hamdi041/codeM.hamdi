<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KosVibe - Pembayaran Sewa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg sticky-top bg-white shadow-sm">
        <div class="container justify-content-center">
            <a class="navbar-brand m-0" href="index.html">
                <i class="bi bi-shield-lock-fill text-success"></i> Kos<span class="brand-vibe">Vibe</span> Pembayaran Aman
            </a>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card p-4 shadow-sm border-0 bg-white rounded-4">
                    <h4 class="fw-bold mb-4 border-bottom pb-3"><i class="bi bi-wallet2 text-primary"></i> Detail Pemesanan Kos</h4>
                    <div class="alert alert-success d-flex align-items-center mb-4">
                        <i class="bi bi-check-circle-fill me-2 fs-4"></i>
                        <div>Anda sedang memesan properti <strong>Kos Putri Muslimah Asri</strong>.</div>
                    </div>

                    <form id="formPembayaran">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nama Lengkap Penyewa</label>
                            <input type="text" class="form-control input-custom" placeholder="Masukkan nama lengkap sesuai KTP" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Pilih Tipe Kost / Kamar</label>
                            <select class="form-select input-custom fw-medium" id="tipeKos" required>
                                <option value="" disabled selected>Pilih tipe kamar yang tersedia...</option>
                                <option value="Standar">Tipe A - Standar (Kipas Angin, Kamar Mandi Luar) - Rp 800.000/bln</option>
                                <option value="Eksklusif">Tipe B - Eksklusif (AC, Kamar Mandi Dalam) - Rp 1.500.000/bln</option>
                                <option value="VIP">Tipe C - VIP (AC, KM Dalam, Kulkas) - Rp 2.200.000/bln</option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Durasi Sewa</label>
                            <select class="form-select input-custom" id="durasiSewa" required>
                                <option value="1 Bulan">1 Bulan</option>
                                <option value="3 Bulan">3 Bulan</option>
                                <option value="6 Bulan">6 Bulan</option>
                                <option value="1 Tahun">1 Tahun (Diskon 10%)</option>
                            </select>
                        </div>
                        <div class="mb-5">
                            <label class="form-label fw-semibold">Metode Pembayaran</label>
                            <select class="form-select input-custom" required>
                                <option value="QRIS">QRIS (OVO, Dana, ShopeePay, GoPay)</option>
                                <option value="Transfer Bank BCA">Transfer Bank BCA</option>
                                <option value="Virtual Account">Virtual Account BNI / BRI</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-success w-100 fw-bold py-3 fs-5 shadow-sm rounded-3">
                            <i class="bi bi-lock-fill"></i> Selesaikan Pembayaran
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>
    <script>
        document.getElementById('formPembayaran').addEventListener('submit', function(e) {
            e.preventDefault();
            const tipe = document.getElementById('tipeKos').value;
            const durasi = document.getElementById('durasiSewa').value;
            const btn = this.querySelector('button[type="submit"]');
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Memproses...';
            btn.disabled = true;
            setTimeout(() => {
                alert(`Hore! Pemesanan kamar ${tipe} untuk durasi ${durasi} berhasil dikonfirmasi. Bukti pembayaran dikirim ke email.`);
                window.location.href = 'index.html';
            }, 1500);
        });
    </script>
</body>
</html>
