<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KosVibe - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="text-center mb-4">
                    <h3 class="fw-bold text-success">Kos<span class="text-warning">Vibe</span></h3>
                    <small class="text-muted">Gunakan nama apa saja untuk uji coba</small>
                </div>
                <div class="card shadow border-0 rounded-4 p-4 bg-white">
                    <h5 class="fw-bold text-center mb-4">Masuk Akun Mahasiswa</h5>
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nama / Username</label>
                            <input type="text" id="loginUser" class="form-control input-custom" placeholder="Contoh: Hamdi_2026" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Kata Sandi</label>
                            <input type="password" class="form-control input-custom" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn btn-primary-custom w-100 fw-bold py-2">Masuk Sekarang</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            localStorage.setItem('kosvibe_user', document.getElementById('loginUser').value);
            alert('Berhasil Masuk!');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
